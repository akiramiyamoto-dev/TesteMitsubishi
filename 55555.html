<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bíblia Sagrada</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        :root {
            --primary: #2c3e50;
            --secondary: #3498db;
            --accent: #e74c3c;
            --light: #ecf0f1;
            --dark: #2c3e50;
            --text: #333333;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            --border: #ddd;
            --old-testament: #8e44ad;
            --new-testament: #27ae60;
        }
        
        body {
            background-color: #f8f9fa;
            color: var(--text);
            line-height: 1.6;
            overflow-x: hidden;
        }
        
        .app-container {
            max-width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        /* Header com Navegação de Livros */
        .header {
            background-color: var(--primary);
            color: white;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: var(--shadow);
        }
        
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .book-title {
            font-size: 1.2rem;
            font-weight: 600;
            text-align: center;
            flex: 1;
        }
        
        .menu-btn {
            background: none;
            border: none;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: background-color 0.2s;
        }
        
        .menu-btn:hover {
            background-color: rgba(255,255,255,0.1);
        }
        
        .books-navigation {
            display: flex;
            align-items: center;
            gap: 8px;
            overflow-x: auto;
            padding: 5px 0;
            scrollbar-width: none;
        }
        
        .books-navigation::-webkit-scrollbar {
            display: none;
        }
        
        .testament-title {
            font-size: 0.8rem;
            font-weight: bold;
            padding: 5px 10px;
            border-radius: 15px;
            white-space: nowrap;
        }
        
        .old-testament {
            background-color: var(--old-testament);
        }
        
        .new-testament {
            background-color: var(--new-testament);
        }
        
        .book-btn {
            background: none;
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 20px;
            padding: 8px 15px;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
            font-size: 0.9rem;
            color: white;
        }
        
        .book-btn:hover {
            background-color: rgba(255,255,255,0.1);
        }
        
        .book-btn.active {
            background-color: var(--secondary);
            border-color: var(--secondary);
        }
        
        /* Main Content */
        .main-content {
            flex: 1;
            display: flex;
            overflow: hidden;
        }
        
        /* Chapters Sidebar - SEMPRE VISÍVEL */
        .chapters-sidebar {
            width: 80px;
            background-color: white;
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            padding: 10px 5px;
        }
        
        .chapter-item {
            background: none;
            border: 1px solid var(--border);
            border-radius: 5px;
            padding: 12px 5px;
            margin-bottom: 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
            font-size: 0.9rem;
        }
        
        .chapter-item:hover {
            background-color: #f0f0f0;
        }
        
        .chapter-item.active {
            background-color: var(--secondary);
            color: white;
            border-color: var(--secondary);
        }
        
        /* Bible Text Area */
        .bible-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }
        
        .verses-container {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background-color: white;
        }
        
        .verse {
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #f0f0f0;
        }
        
        .verse-number {
            font-weight: bold;
            color: var(--secondary);
            margin-right: 8px;
            background-color: #f0f7ff;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.9rem;
        }
        
        .verse-text {
            font-size: 1.1rem;
            line-height: 1.8;
        }
        
        .chapter-title {
            text-align: center;
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: var(--primary);
            padding-bottom: 10px;
            border-bottom: 2px solid var(--light);
        }
        
        /* Bottom Verses Navigation - SEMPRE VISÍVEL */
        .verses-navigation {
            background-color: white;
            border-top: 1px solid var(--border);
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            overflow-x: auto;
        }
        
        .verse-btn {
            background: none;
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 10px 15px;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
            font-size: 0.9rem;
        }
        
        .verse-btn:hover {
            background-color: #f0f0f0;
        }
        
        .verse-btn.active {
            background-color: var(--primary);
            color: white;
            border-color: var(--primary);
        }
        
        .nav-controls {
            display: flex;
            gap: 10px;
            margin-left: auto;
        }
        
        .nav-arrow {
            background: var(--secondary);
            color: white;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        
        .nav-arrow:hover {
            background-color: #2980b9;
        }
        
        .nav-arrow:disabled {
            background-color: #bdc3c7;
            cursor: not-allowed;
        }
        
        /* Loading Indicator */
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100px;
            color: var(--secondary);
            font-size: 1.2rem;
        }
        
        .loading i {
            margin-right: 10px;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* Settings Panel */
        .settings-panel {
            position: absolute;
            top: 0;
            right: -300px;
            width: 300px;
            height: 100%;
            background-color: white;
            box-shadow: -2px 0 10px rgba(0,0,0,0.1);
            transition: right 0.3s ease;
            padding: 20px;
            z-index: 100;
            overflow-y: auto;
        }
        
        .settings-panel.active {
            right: 0;
        }
        
        .settings-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border);
        }
        
        .settings-option {
            margin-bottom: 20px;
        }
        
        .settings-option label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
        }
        
        .font-size-controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        
        .font-btn {
            background: var(--light);
            border: 1px solid var(--border);
            border-radius: 5px;
            padding: 8px 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .font-btn.active {
            background: var(--secondary);
            color: white;
            border-color: var(--secondary);
        }
        
        .theme-options {
            display: flex;
            gap: 10px;
        }
        
        .theme-option {
            flex: 1;
            padding: 10px;
            text-align: center;
            border: 1px solid var(--border);
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .theme-option.active {
            border-color: var(--secondary);
            background-color: #f0f7ff;
        }
        
        /* Responsive Adjustments */
        @media (max-width: 768px) {
            .chapters-sidebar {
                width: 70px;
            }
            
            .chapter-item {
                padding: 10px 3px;
                font-size: 0.85rem;
            }
            
            .verses-container {
                padding: 15px;
            }
            
            .verse-text {
                font-size: 1rem;
            }
            
            .verses-navigation {
                padding: 12px;
            }
            
            .verse-btn {
                padding: 8px 12px;
                font-size: 0.85rem;
            }
            
            .book-btn {
                padding: 6px 12px;
                font-size: 0.85rem;
            }
            
            .nav-arrow {
                width: 35px;
                height: 35px;
            }
            
            .settings-panel {
                width: 280px;
            }
        }
        
        @media (max-width: 480px) {
            .chapters-sidebar {
                width: 60px;
            }
            
            .chapter-item {
                padding: 8px 2px;
                font-size: 0.8rem;
                margin-bottom: 5px;
            }
            
            .books-navigation {
                gap: 5px;
            }
            
            .book-btn {
                padding: 5px 10px;
                font-size: 0.8rem;
            }
            
            .testament-title {
                font-size: 0.7rem;
                padding: 4px 8px;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Header com Navegação de Livros -->
        <header class="header">
            <div class="header-top">
                <button class="menu-btn" id="menu-btn">
                    <i class="fas fa-bars"></i>
                </button>
                <div class="book-title" id="current-book">Salmos 1</div>
                <button class="menu-btn" id="settings-btn">
                    <i class="fas fa-cog"></i>
                </button>
            </div>
            
            <nav class="books-navigation" id="books-navigation">
                <!-- Livros serão gerados por JavaScript -->
            </nav>
        </header>
        
        <!-- Main Content -->
        <div class="main-content">
            <!-- Chapters Sidebar - SEMPRE VISÍVEL -->
            <div class="chapters-sidebar" id="chapters-sidebar">
                <!-- Capítulos serão gerados por JavaScript -->
            </div>
            
            <!-- Bible Text Area -->
            <div class="bible-content">
                <div class="verses-container" id="verses-container">
                    <div class="loading">
                        <i class="fas fa-spinner"></i> Carregando...
                    </div>
                </div>
            </div>
            
            <!-- Settings Panel -->
            <div class="settings-panel" id="settings-panel">
                <div class="settings-header">
                    <h3>Configurações</h3>
                    <button class="menu-btn" id="close-settings">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
                
                <div class="settings-option">
                    <label>Tamanho da Fonte</label>
                    <div class="font-size-controls">
                        <button class="font-btn" data-size="small">P</button>
                        <button class="font-btn active" data-size="medium">M</button>
                        <button class="font-btn" data-size="large">G</button>
                    </div>
                </div>
                
                <div class="settings-option">
                    <label>Tema de Leitura</label>
                    <div class="theme-options">
                        <div class="theme-option active" data-theme="light">
                            <i class="fas fa-sun"></i><br>Claro
                        </div>
                        <div class="theme-option" data-theme="sepia">
                            <i class="fas fa-book"></i><br>Sépia
                        </div>
                        <div class="theme-option" data-theme="dark">
                            <i class="fas fa-moon"></i><br>Escuro
                        </div>
                    </div>
                </div>
                
                <div class="settings-option">
                    <label>Versão da Bíblia</label>
                    <select id="bible-version" class="font-btn" style="width: 100%; padding: 10px;">
                        <option value="acf">Almeida Corrigida Fiel</option>
                        <option value="ara">Almeida Revista Atualizada</option>
                        <option value="nvi">Nova Versão Internacional</option>
                    </select>
                </div>
            </div>
        </div>
        
        <!-- Verses Navigation - SEMPRE VISÍVEL -->
        <nav class="verses-navigation" id="verses-navigation">
            <!-- Versículos serão gerados por JavaScript -->
            
            <div class="nav-controls">
                <button class="nav-arrow" id="prev-chapter">
                    <i class="fas fa-arrow-left"></i>
                </button>
                <button class="nav-arrow" id="next-chapter">
                    <i class="fas fa-arrow-right"></i>
                </button>
            </div>
        </nav>
    </div>

    <script>
        // Dados completos da Bíblia (estrutura simplificada)
        const bibleStructure = {
            "Antigo Testamento": {
                "Pentateuco": ["Gênesis", "Êxodo", "Levítico", "Números", "Deuteronômio"],
                "Históricos": ["Josué", "Juízes", "Rute", "1 Samuel", "2 Samuel", "1 Reis", "2 Reis", "1 Crônicas", "2 Crônicas", "Esdras", "Neemias", "Ester"],
                "Poéticos": ["Jó", "Salmos", "Provérbios", "Eclesiastes", "Cânticos"],
                "Profetas Maiores": ["Isaías", "Jeremias", "Lamentações", "Ezequiel", "Daniel"],
                "Profetas Menores": ["Oséias", "Joel", "Amós", "Obadias", "Jonas", "Miquéias", "Naum", "Habacuque", "Sofonias", "Ageu", "Zacarias", "Malaquias"]
            },
            "Novo Testamento": {
                "Evangelhos": ["Mateus", "Marcos", "Lucas", "João"],
                "Histórico": ["Atos"],
                "Cartas Paulinas": ["Romanos", "1 Coríntios", "2 Coríntios", "Gálatas", "Efésios", "Filipenses", "Colossenses", "1 Tessalonicenses", "2 Tessalonicenses", "1 Timóteo", "2 Timóteo", "Tito", "Filemon"],
                "Cartas Gerais": ["Hebreus", "Tiago", "1 Pedro", "2 Pedro", "1 João", "2 João", "3 João", "Judas"],
                "Profético": ["Apocalipse"]
            }
        };

        // Número de capítulos por livro
        const chaptersCount = {
            "Gênesis": 50, "Êxodo": 40, "Levítico": 27, "Números": 36, "Deuteronômio": 34,
            "Josué": 24, "Juízes": 21, "Rute": 4, "1 Samuel": 31, "2 Samuel": 24, 
            "1 Reis": 22, "2 Reis": 25, "1 Crônicas": 29, "2 Crônicas": 36, "Esdras": 10, 
            "Neemias": 13, "Ester": 10, "Jó": 42, "Salmos": 150, "Provérbios": 31, 
            "Eclesiastes": 12, "Cânticos": 8, "Isaías": 66, "Jeremias": 52, "Lamentações": 5, 
            "Ezequiel": 48, "Daniel": 12, "Oséias": 14, "Joel": 3, "Amós": 9, 
            "Obadias": 1, "Jonas": 4, "Miquéias": 7, "Naum": 3, "Habacuque": 3, 
            "Sofonias": 3, "Ageu": 2, "Zacarias": 14, "Malaquias": 4,
            "Mateus": 28, "Marcos": 16, "Lucas": 24, "João": 21, "Atos": 28,
            "Romanos": 16, "1 Coríntios": 16, "2 Coríntios": 13, "Gálatas": 6, 
            "Efésios": 6, "Filipenses": 4, "Colossenses": 4, "1 Tessalonicenses": 5, 
            "2 Tessalonicenses": 3, "1 Timóteo": 6, "2 Timóteo": 4, "Tito": 3, 
            "Filemon": 1, "Hebreus": 13, "Tiago": 5, "1 Pedro": 5, "2 Pedro": 3, 
            "1 João": 5, "2 João": 1, "3 João": 1, "Judas": 1, "Apocalipse": 22
        };

        // Estado da aplicação
        let currentBook = "Salmos";
        let currentChapter = 1;
        let currentVerses = [];
        let fontSize = "medium";
        let theme = "light";

        // Elementos DOM
        const chaptersSidebar = document.getElementById('chapters-sidebar');
        const booksNavigation = document.getElementById('books-navigation');
        const versesNavigation = document.getElementById('verses-navigation');
        const versesContainer = document.getElementById('verses-container');
        const currentBookElement = document.getElementById('current-book');
        const prevChapterBtn = document.getElementById('prev-chapter');
        const nextChapterBtn = document.getElementById('next-chapter');
        const menuBtn = document.getElementById('menu-btn');
        const settingsBtn = document.getElementById('settings-btn');
        const settingsPanel = document.getElementById('settings-panel');
        const closeSettings = document.getElementById('close-settings');

        // Inicialização
        document.addEventListener('DOMContentLoaded', function() {
            populateBooksNavigation();
            populateChaptersSidebar();
            loadChapterContent();
            setupEventListeners();
            applySettings();
        });

        // Preencher a navegação de livros (header)
        function populateBooksNavigation() {
            booksNavigation.innerHTML = '';
            
            // Antigo Testamento
            const oldTestamentTitle = document.createElement('div');
            oldTestamentTitle.className = 'testament-title old-testament';
            oldTestamentTitle.textContent = 'AT';
            booksNavigation.appendChild(oldTestamentTitle);
            
            // Adicionar livros do Antigo Testamento
            for (const category in bibleStructure["Antigo Testamento"]) {
                bibleStructure["Antigo Testamento"][category].forEach(book => {
                    const bookBtn = createBookButton(book);
                    booksNavigation.appendChild(bookBtn);
                });
            }
            
            // Novo Testamento
            const newTestamentTitle = document.createElement('div');
            newTestamentTitle.className = 'testament-title new-testament';
            newTestamentTitle.textContent = 'NT';
            booksNavigation.appendChild(newTestamentTitle);
            
            // Adicionar livros do Novo Testamento
            for (const category in bibleStructure["Novo Testamento"]) {
                bibleStructure["Novo Testamento"][category].forEach(book => {
                    const bookBtn = createBookButton(book);
                    booksNavigation.appendChild(bookBtn);
                });
            }
        }

        function createBookButton(book) {
            const bookBtn = document.createElement('button');
            bookBtn.className = 'book-btn';
            if (book === currentBook) {
                bookBtn.classList.add('active');
            }
            bookBtn.textContent = book;
            bookBtn.addEventListener('click', () => {
                selectBook(book);
            });
            return bookBtn;
        }

        // Preencher a sidebar de capítulos (lado esquerdo)
        function populateChaptersSidebar() {
            chaptersSidebar.innerHTML = '';
            const totalChapters = chaptersCount[currentBook];
            
            for (let i = 1; i <= totalChapters; i++) {
                const chapterItem = document.createElement('button');
                chapterItem.className = 'chapter-item';
                if (i === currentChapter) {
                    chapterItem.classList.add('active');
                }
                chapterItem.textContent = i;
                chapterItem.addEventListener('click', () => {
                    selectChapter(i);
                });
                chaptersSidebar.appendChild(chapterItem);
            }
        }

        // Preencher a navegação de versículos (parte inferior)
        function populateVersesNavigation() {
            // Limpar versículos anteriores, mas manter os controles de navegação
            const navControls = document.querySelector('.nav-controls');
            versesNavigation.innerHTML = '';
            
            if (currentVerses && currentVerses.length > 0) {
                // Adicionar botões para cada versículo
                currentVerses.forEach((verse, index) => {
                    const verseBtn = document.createElement('button');
                    verseBtn.className = 'verse-btn';
                    if (index === 0) {
                        verseBtn.classList.add('active');
                    }
                    verseBtn.textContent = verse.number;
                    verseBtn.addEventListener('click', () => {
                        selectVerse(verse.number);
                    });
                    versesNavigation.appendChild(verseBtn);
                });
            }
            
            // Adicionar controles de navegação novamente
            versesNavigation.appendChild(navControls);
        }

        // Carregar conteúdo do capítulo
        async function loadChapterContent() {
            // Mostrar indicador de carregamento
            versesContainer.innerHTML = '<div class="loading"><i class="fas fa-spinner"></i> Carregando...</div>';
            
            try {
                // Em uma aplicação real, isso viria de uma API
                // Aqui vamos simular com dados estáticos
                await new Promise(resolve => setTimeout(resolve, 500));
                
                // Gerar versículos de exemplo
                currentVerses = generateVerses(currentBook, currentChapter);
                
                // Atualizar a interface
                updateBibleText();
                populateVersesNavigation();
                updateNavigationButtons();
                
            } catch (error) {
                console.error('Erro ao carregar capítulo:', error);
                versesContainer.innerHTML = '<p>Erro ao carregar o capítulo. Tente novamente.</p>';
            }
        }

        // Gerar versículos de exemplo (em uma aplicação real, isso viria de uma API)
        function generateVerses(book, chapter) {
            const verses = [];
            const verseCount = Math.floor(Math.random() * 10) + 15; // Entre 15 e 25 versículos
            
            for (let i = 1; i <= verseCount; i++) {
                verses.push({
                    number: i,
                    text: `Este é o versículo ${i} do ${book} ${chapter}. Em uma aplicação real, este texto viria de uma base de dados bíblica completa.`
                });
            }
            
            // Adicionar alguns versículos conhecidos para demonstração
            if (book === "Salmos" && chapter === 1) {
                verses[0].text = "Bem-aventurado o homem que não anda segundo o conselho dos ímpios, nem se detém no caminho dos pecadores, nem se assenta na roda dos escarnecedores.";
                verses[1].text = "Antes tem o seu prazer na lei do Senhor, e na sua lei medita de dia e de noite.";
                verses[2].text = "Pois será como a árvore plantada junto a ribeiros de águas, a qual dá o seu fruto no seu tempo; as suas folhas não cairão, e tudo quanto fizer prosperará.";
            }
            
            if (book === "João" && chapter === 3) {
                verses[15].text = "Porque Deus amou o mundo de tal maneira que deu o seu Filho unigênito, para que todo aquele que nele crê não pereça, mas tenha a vida eterna.";
            }
            
            if (book === "Gênesis" && chapter === 1) {
                verses[0].text = "No princípio, criou Deus os céus e a terra.";
                verses[1].text = "A terra, porém, estava sem forma e vazia; havia trevas sobre a face do abismo, e o Espírito de Deus pairava por sobre as águas.";
            }
            
            return verses;
        }

        // Atualizar o texto bíblico exibido
        function updateBibleText() {
            versesContainer.innerHTML = '';
            currentBookElement.textContent = `${currentBook} ${currentChapter}`;
            
            // Adicionar título do capítulo
            const chapterTitle = document.createElement('h2');
            chapterTitle.className = 'chapter-title';
            chapterTitle.textContent = `${currentBook} ${currentChapter}`;
            versesContainer.appendChild(chapterTitle);
            
            if (currentVerses && currentVerses.length > 0) {
                currentVerses.forEach(verse => {
                    const verseElement = document.createElement('div');
                    verseElement.className = 'verse';
                    verseElement.id = `verse-${verse.number}`;
                    
                    const verseNumber = document.createElement('span');
                    verseNumber.className = 'verse-number';
                    verseNumber.textContent = verse.number;
                    
                    const verseText = document.createElement('span');
                    verseText.className = 'verse-text';
                    verseText.textContent = verse.text;
                    
                    verseElement.appendChild(verseNumber);
                    verseElement.appendChild(verseText);
                    versesContainer.appendChild(verseElement);
                });
            } else {
                versesContainer.innerHTML = '<p>Conteúdo não disponível para este capítulo.</p>';
            }
            
            // Rolagem para o topo
            versesContainer.scrollTop = 0;
        }

        // Atualizar estado dos botões de navegação
        function updateNavigationButtons() {
            const totalChapters = chaptersCount[currentBook];
            prevChapterBtn.disabled = currentChapter <= 1;
            nextChapterBtn.disabled = currentChapter >= totalChapters;
        }

        // Selecionar um livro
        function selectBook(book) {
            currentBook = book;
            currentChapter = 1;
            
            // Atualizar botões ativos
            document.querySelectorAll('.book-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.textContent === book) {
                    btn.classList.add('active');
                }
            });
            
            populateChaptersSidebar();
            loadChapterContent();
        }

        // Selecionar um capítulo
        function selectChapter(chapter) {
            currentChapter = chapter;
            
            // Atualizar estado ativo dos capítulos
            document.querySelectorAll('.chapter-item').forEach((item, index) => {
                if (index + 1 === chapter) {
                    item.classList.add('active');
                } else {
                    item.classList.remove('active');
                }
            });
            
            loadChapterContent();
        }

        // Selecionar um versículo
        function selectVerse(verseNum) {
            // Atualizar estado ativo dos versículos
            document.querySelectorAll('.verse-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.textContent === verseNum.toString()) {
                    btn.classList.add('active');
                }
            });
            
            // Rolar para o versículo selecionado
            const verseElement = document.getElementById(`verse-${verseNum}`);
            if (verseElement) {
                verseElement.scrollIntoView({ behavior: 'smooth', block: 'center' });
                
                // Destacar o versículo
                verseElement.style.backgroundColor = '#f0f7ff';
                setTimeout(() => {
                    verseElement.style.backgroundColor = 'transparent';
                }, 2000);
            }
        }

        // Navegação entre capítulos
        function goToPrevChapter() {
            if (currentChapter > 1) {
                selectChapter(currentChapter - 1);
            }
        }

        function goToNextChapter() {
            const totalChapters = chaptersCount[currentBook];
            if (currentChapter < totalChapters) {
                selectChapter(currentChapter + 1);
            }
        }

        // Configurar event listeners
        function setupEventListeners() {
            prevChapterBtn.addEventListener('click', goToPrevChapter);
            nextChapterBtn.addEventListener('click', goToNextChapter);
            
            // Configurações
            menuBtn.addEventListener('click', toggleSettings);
            settingsBtn.addEventListener('click', toggleSettings);
            closeSettings.addEventListener('click', toggleSettings);
            
            // Controles de fonte
            document.querySelectorAll('.font-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.font-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    fontSize = this.getAttribute('data-size');
                    applyFontSize();
                });
            });
            
            // Controles de tema
            document.querySelectorAll('.theme-option').forEach(option => {
                option.addEventListener('click', function() {
                    document.querySelectorAll('.theme-option').forEach(o => o.classList.remove('active'));
                    this.classList.add('active');
                    theme = this.getAttribute('data-theme');
                    applyTheme();
                });
            });
            
            // Navegação por teclado
            document.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowLeft') {
                    goToPrevChapter();
                } else if (e.key === 'ArrowRight') {
                    goToNextChapter();
                }
            });
        }

        // Alternar painel de configurações
        function toggleSettings() {
            settingsPanel.classList.toggle('active');
        }

        // Aplicar tamanho da fonte
        function applyFontSize() {
            const sizes = {
                'small': '0.9rem',
                'medium': '1.1rem',
                'large': '1.3rem'
            };
            
            document.querySelectorAll('.verse-text').forEach(text => {
                text.style.fontSize = sizes[fontSize];
            });
        }

        // Aplicar tema
        function applyTheme() {
            const themes = {
                'light': {
                    '--primary': '#2c3e50',
                    '--secondary': '#3498db',
                    '--light': '#ecf0f1',
                    'bg': '#ffffff',
                    'text': '#333333'
                },
                'sepia': {
                    '--primary': '#8B4513',
                    '--secondary': '#D2691E',
                    '--light': '#F5EBD4',
                    'bg': '#F5EBD4',
                    'text': '#5C4033'
                },
                'dark': {
                    '--primary': '#34495e',
                    '--secondary': '#3498db',
                    '--light': '#2c3e50',
                    'bg': '#1a1a1a',
                    'text': '#ecf0f1'
                }
            };
            
            const selectedTheme = themes[theme];
            
            // Aplicar variáveis CSS
            document.documentElement.style.setProperty('--primary', selectedTheme['--primary']);
            document.documentElement.style.setProperty('--secondary', selectedTheme['--secondary']);
            document.documentElement.style.setProperty('--light', selectedTheme['--light']);
            
            // Aplicar cores de fundo e texto
            document.body.style.backgroundColor = selectedTheme.bg;
            document.body.style.color = selectedTheme.text;
            document.querySelector('.verses-container').style.backgroundColor = selectedTheme.bg;
            document.querySelector('.verses-container').style.color = selectedTheme.text;
        }

        // Aplicar configurações salvas
        function applySettings() {
            applyFontSize();
            applyTheme();
        }
    </script>
</body>
</html>
